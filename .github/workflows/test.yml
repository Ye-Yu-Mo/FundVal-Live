name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check . 2>&1 | tail -5 || true

      - name: Pyright
        working-directory: backend
        run: uv run pyright 2>&1 | tail -5 || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Prettier format check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,css}" 2>&1 | tail -5 || true

      - name: ESLint
        working-directory: frontend
        run: npm run lint 2>&1 | tail -10 || true

  test:
    needs: [lint, frontend-lint]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fundval
          POSTGRES_USER: fundval
          POSTGRES_PASSWORD: fundval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run tests
        working-directory: backend
        run: uv run pytest
        env:
          DB_TYPE: postgresql
          POSTGRES_DB: fundval
          POSTGRES_USER: fundval
          POSTGRES_PASSWORD: fundval
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: false
          ALLOWED_HOSTS: localhost
